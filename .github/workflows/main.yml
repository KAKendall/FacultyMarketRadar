name: Weekly job refresh and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official sources
        run: npm run refresh

      - name: Commit refreshed data
        run: |
          git config user.name "faculty-market-bot"
          git config user.email "faculty-market-bot@users.noreply.github.com"
          git add data/jobs.json data/source-health.json
          git diff --cached --quiet || git commit -m "data: weekly faculty market refresh [skip ci]"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        uses: actions/deploy-pages@v4
